name: Amazon P&L Slack Report
on:
  schedule:
    # Runs early Monday morning (13:00 UTC = ~9am ET). The script covers the
    # full Monday-Sunday week that just ended (yesterday), so weekend sales
    # are always included.
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force a report to run today (for testing), ignoring the date check"
        required: false
        default: false
        type: boolean
      debug_dump:
        description: "Print raw Amazon fee data into this log (private, not posted to Slack) to help refine categories"
        required: false
        default: false
        type: boolean
      custom_start_date:
        description: "Optional: run for a custom date range instead (format YYYY-MM-DD), e.g. to check a full month against Seller Central. Leave blank for the normal weekly run."
        required: false
        default: ""
        type: string
      custom_end_date:
        description: "End date for the custom range above (format YYYY-MM-DD). Both custom dates must be set together."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: pnl-report
  cancel-in-progress: false

jobs:
  pnl-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run P&L report and notify Slack
        env:
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          AMAZON_REFRESH_TOKEN: ${{ secrets.AMAZON_REFRESH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_PNL }}
          FORCE_RUN: ${{ inputs.force_run }}
          DEBUG_DUMP: ${{ inputs.debug_dump }}
          CUSTOM_START_DATE: ${{ inputs.custom_start_date }}
          CUSTOM_END_DATE: ${{ inputs.custom_end_date }}
        run: python pnl_report.py

      - name: Save updated state back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnl_state.json
          if ! git diff --staged --quiet; then
            git commit -m "Update P&L report state"
            git pull --rebase origin main
            git push
          fi
